publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 8cb935c63a86ca3e5fb38758edd5bb8ec44dccdd
  audioplayers: ^6.5.0
  battery_plus: ">=6.0.0 <8.0.0"
  home_widget: ">=0.7.0 <0.10.0"
  file_picker: ">=8.1.0 <11.0.0"
  path_provider: ^2.1.4
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.gamestudio100.kisisel_motoru
        pluginClass: KisiselMotoruPlugin
